
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JWT Login / Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen bg-gradient-to-br from-blue-300 to-purple-200 flex items-center justify-center">
<div class="w-full max-w-4xl bg-white/30 backdrop-blur-lg rounded-xl shadow-xl flex flex-col md:flex-row overflow-hidden transition-all duration-500" id="container">
  
  <!-- Switch panel -->
  <div class="w-full md:w-1/3 bg-white/40 p-6 text-center">
    <h3 id="switch-text" class="text-xl font-semibold mb-4">Already a member?</h3>
    <p id="switch-desc" class="text-gray-700 mb-6">Click below to log into your account.</p>
    <button id="toggleBtn" class="px-6 py-2 border-2 border-indigo-600 text-indigo-600 rounded-full hover:bg-indigo-600 hover:text-white transition">Login</button>
  </div>

  <!-- Forms -->
  <div class="w-full md:w-2/3 p-6">
    
    <!-- Login Form -->
    <div class="login-form hidden">
      <h2 class="text-center text-2xl font-bold mb-6">Login</h2>
      
      <form id="loginForm" class="space-y-4">
        <input name="username" type="text" placeholder="Username" required class="w-full px-4 py-2 rounded-md bg-white/80">
        <input name="password" type="password" placeholder="Password" required class="w-full px-4 py-2 rounded-md bg-white/80">
        <button type="submit" class="w-full py-2 bg-indigo-600 text-white rounded-full hover:bg-indigo-700">Login</button>
      </form>
      
      <a href="{% url 'social:begin' 'google-oauth2' %}" 
   class="pt-2 flex items-center justify-center gap-2 px-6 py-2 bg-gray-200 border border-gray-300 rounded-md shadow-sm hover:bg-gray-100 transition duration-200 text-gray-800 font-medium">
    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5" />
    Login with Google
</a>


      <div id="loginError" class="text-red-600 mt-4 text-center hidden"></div>
    </div>

    <!-- Register Form -->
    <div class="signup-form block">
      <h2 class="text-center text-2xl font-bold mb-6">Register</h2>
      <form id="registerForm" class="space-y-4">
        <input name="first_name" type="text" placeholder="First Name" required class="w-full px-4 py-2 rounded-md bg-white/80">
        <input name="last_name" type="text" placeholder="Last Name" required class="w-full px-4 py-2 rounded-md bg-white/80">
        <input name="username" type="text" placeholder="Username" required class="w-full px-4 py-2 rounded-md bg-white/80">
        <input name="email" type="email" placeholder="Email" required class="w-full px-4 py-2 rounded-md bg-white/80">
        <input name="password" type="password" placeholder="Password" required class="w-full px-4 py-2 rounded-md bg-white/80">
        <button type="submit" class="w-full py-2 bg-indigo-600 text-white rounded-full hover:bg-indigo-700">Register</button>
      </form>
      <div id="registerSuccess" class="text-green-600 mt-4 text-center hidden">Registration successful! You can now login.</div>
      <div id="registerError" class="text-red-600 mt-4 text-center hidden"></div>
    </div>

  </div>
</div>

<!-- Toggle and JS functionality -->
<script>
  const toggleBtn = document.getElementById('toggleBtn');
  const switchText = document.getElementById('switch-text');
  const switchDesc = document.getElementById('switch-desc');
  const loginFormDiv = document.querySelector('.login-form');
  const registerFormDiv = document.querySelector('.signup-form');

  toggleBtn.addEventListener('click', () => {
    const isLoginShown = loginFormDiv.classList.contains('block');
    if (isLoginShown) {
      loginFormDiv.classList.replace('block', 'hidden');
      registerFormDiv.classList.replace('hidden', 'block');
      toggleBtn.textContent = "Login";
      switchText.textContent = "Already a member?";
      switchDesc.textContent = "Click below to log into your account.";
    } else {
      loginFormDiv.classList.replace('hidden', 'block');
      registerFormDiv.classList.replace('block', 'hidden');
      toggleBtn.textContent = "Register";
      switchText.textContent = "New here?";
      switchDesc.textContent = "Click below to create an account.";
    }
  });

  // REGISTER FORM SUBMIT
  document.getElementById("registerForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const form = e.target;
    const data = {
      first_name: form.first_name.value,
      last_name: form.last_name.value,
      username: form.username.value,
      email: form.email.value,
      password: form.password.value
    };

    const res = await fetch("/api/apiregister/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    const resData = await res.json();
    if (res.ok) {
      document.getElementById("registerSuccess").classList.remove("hidden");
      document.getElementById("registerError").classList.add("hidden");
      form.reset();
    } else {
      document.getElementById("registerError").textContent = resData?.detail || Object.values(resData).join(" ");
      document.getElementById("registerError").classList.remove("hidden");
      document.getElementById("registerSuccess").classList.add("hidden");
    }
  });

  // LOGIN FORM SUBMIT
  document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const form = e.target;
    const data = {
      username: form.username.value,
      password: form.password.value
    };

    const res = await fetch("/api/apilogin/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    const resData = await res.json();
    if (res.ok) {
      // Save token to localStorage
      localStorage.setItem("access", resData.tokens.access);
      localStorage.setItem("refresh", resData.tokens.refresh);
      alert("Login successful!");
      window.location.href = "/api/"; // or wherever you want
    } else {
      document.getElementById("loginError").textContent = resData?.detail || "Invalid login";
      document.getElementById("loginError").classList.remove("hidden");
    }
  });

</script>
</body>
</html>
