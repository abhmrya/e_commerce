{% extends "index.html" %}
{% block content %}
<div class="max-w-3xl mx-auto mt-10">
  <div class="bg-white shadow-xl rounded-2xl p-6 flex flex-col items-center text-center space-y-4">
    
    <!-- Profile Photo -->
    <div class="w-32 h-32 rounded-full overflow-hidden border-4 border-blue-500">
      <img src="{{ profile.photo.url }}" alt="Profile Photo" class="object-cover w-full h-full">
    </div>

    <!-- User Info -->
    <div>
      <h2 class="text-2xl font-bold text-gray-800">{{ profile.user.name }}</h2>
      <p class="text-gray-500">{{ profile.user.email }}</p>
    </div>

    <!-- Other Details -->
    <div class="w-full mt-4 grid grid-cols-2 gap-4 text-left">
      <div>
        <p class="text-sm text-gray-500">First Name</p>
        <p class="text-base font-medium text-gray-800">{{ profile.user.first_name }}</p>
      </div>
      <div>
        <p class="text-sm text-gray-500">Last Name</p>
        <p class="text-base font-medium text-gray-800">{{ profile.user.last_name }}</p>
      </div>
      <div class="col-span-2">
        <p class="text-sm text-gray-500">Address</p>
        <p class="text-base font-medium text-gray-800">{{ profile.address }}</p>
      </div>
      <div class="col-span-2">
        <p class="text-sm text-gray-500">Pincode</p>
        <p class="text-base font-medium text-gray-800">{{ profile.pincode }}</p>
      </div>
    </div>

    <!-- Buttons -->
    <div class="w-full flex justify-between mt-6">
      <a href="{% url 'profile_edit' profile.id %}" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-xl transition duration-300">Edit</a>
      <a href="{% url 'index' %}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-6 rounded-xl transition duration-300">Back</a>
    </div>

  </div>
</div>
{% endblock %}
