<!-- templates/product_list.html -->
{% extends "index.html" %}
{% block content %}
<div class="max-w-6xl mx-auto p-6">
  <h1 class="text-3xl font-bold text-gray-800 mb-6">All Products</h1>
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    {% for product in products %}
      <div class="bg-white p-4 rounded-lg shadow hover:shadow-lg transition">
        <img src="{{ product.product_image.url }}" alt="{{ product.product_name }}" class="w-full h-40 object-cover rounded">
        <h2 class="text-lg font-semibold mt-2">{{ product.product_name }}</h2>
        <p class="text-gray-600">₹{{ product.rupees }}</p>
        <a href="{% url 'add_to_cart' product.id %}" class="mt-2 inline-block bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600">Add to Cart</a>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
