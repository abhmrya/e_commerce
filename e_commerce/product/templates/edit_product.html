{% extends "index.html" %}
{% block content %}
<form id="editForm" enctype="multipart/form-data" class="space-y-4 text-white">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
      Save Changes
    </button>
</form>


<script>
function getCSRFToken() {
    return document.querySelector('[name=csrfmiddlewaretoken]').value;
}

document.getElementById("editForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const form = this;
    const formData = new FormData(form);

    // Remove empty file field if no new file selected
    const fileInput = form.querySelector('input[type="file"][name="product_image"]');
    if (fileInput && fileInput.files.length === 0) {
        formData.delete("product_image");
    }

    const productId = "{{ product.id }}";

    const response = await fetch(`/api/products/${productId}/`, {
        method: "PATCH",
        headers: {
            "X-CSRFToken": getCSRFToken()
        },
        body: formData
    });

    if (response.ok) {
        const data = await response.json();
        alert("✅ Product updated successfully!");
        console.log(data);
        window.location.href='/api/'
    } else {
        const errorData = await response.json();
        alert("❌ Error updating product!");
        console.error(errorData);
    }
});

</script>
{% endblock content %}
